spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cookinglog?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: skso1951
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  
  security:
    user:
      name: admin
      password: admin
  
  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

server:
  port: 8080
  tomcat:
    connection-timeout: 60000
    keep-alive-timeout: 60000
    max-keep-alive-requests: 100
  shutdown: graceful

logging:
  level:
    '[org.springframework.security]': WARN
    '[com.example.demo]': INFO
    '[org.springframework.web]': WARN
    '[org.hibernate.SQL]': WARN
    root: INFO